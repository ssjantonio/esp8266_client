# HTTP en la IP del servidor: OTA ESP8266 + Wekan en /
# Convive con sites-enabled/wekan.hidraquim.com (mismo backend :8091).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.168.17.159 _;

    client_max_body_size 50m;

    # OTA: sin autenticación (el cliente no envía credenciales)
    location = /update/esp8266 {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload-esp8266 {
        client_max_body_size 2m;
        auth_basic "ESP8266 firmware";
        auth_basic_user_file /etc/nginx/esp8266-upd.htpasswd;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3010;
    }

    # Wekan en la raíz (como antes con default en esta IP)
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}