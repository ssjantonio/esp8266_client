# Sitio HTTP para OTA ESP8266 — copiar a /etc/nginx/sites-available/esp8266-upd
# y enlazar en sites-enabled. Ajustar server_name si aplica.

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.17.159;

    client_max_body_size 2m;

    # OTA: sin autenticación (el cliente no envía credenciales)
    location = /update/esp8266 {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

  # Panel de subida: autenticación básica (htpasswd)
    location /upload-esp8266 {
        auth_basic "ESP8266 firmware";
        auth_basic_user_file /etc/nginx/esp8266-upd.htpasswd;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3010;
    }
}